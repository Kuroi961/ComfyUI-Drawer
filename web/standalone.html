<!doctype html>
<!--
  ComfyUI-Drawer — standalone page.
  Runs Drawer without loading the ComfyUI frontend bundle. Served by ComfyUI
  at /extensions/<this-node>/standalone.html; /drawer/app redirects here.
  Deck and XYZ Plot run on saved workflows through web/js/headless.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>ComfyUI Drawer</title>
    <link rel="icon" href="data:,">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--cd-panel, #0d0d0d);
            color: var(--cd-text, #e0e0e0);
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .cd-standalone-error {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            text-align: center;
            font-size: 14px;
        }
        .cd-standalone-error code {
            opacity: 0.7;
            font-size: 12px;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <script type="module">
        import { StandaloneApi } from './js/core/standalone-api.js';
        import { ComfyBridge } from './js/core/comfy-bridge.js';
        import { setApiProvider } from './js/core/api-utils.js';
        import { HeadlessApp } from './js/headless/headless-app.js';
        import { attachStandaloneWorkflowBar } from './js/services/standalone-workflow.js';
        import { DRAWER_VERSION } from './js/version.js';
        import { startDrawerPlatform, loadDrawerVersion, createDrawerBootPlaceholder } from './js/drawer-platform.js';

        const showBootError = (e) => {
            console.error('[ComfyDrawer] Standalone boot failed:', e);
            const box = document.createElement('div');
            box.className = 'cd-standalone-error';
            const title = document.createElement('div');
            title.textContent = 'ComfyUI Drawer failed to start.';
            const detail = document.createElement('code');
            detail.textContent = String(e?.message || e);
            box.append(title, detail);
            document.body.appendChild(box);
        };

        try {
            const api = new StandaloneApi();
            setApiProvider(api);
            const bootPlaceholder = createDrawerBootPlaceholder();
            const app = new HeadlessApp(api, await api.loadSettings());
            await app.init();
            const bridge = new ComfyBridge(app, api, { standalone: true });
            const drawerVersion = await loadDrawerVersion(api, DRAWER_VERSION);
            await startDrawerPlatform({ bridge, drawerVersion, bootPlaceholder });
            attachStandaloneWorkflowBar(window.ComfyDrawer.shell, app);
        } catch (e) {
            document.getElementById('comfy-drawer-boot')?.remove();
            showBootError(e);
        }
    </script>
</body>
</html>
